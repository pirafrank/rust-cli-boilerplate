name: MSRV check

on:
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - 'justfile'
      - '**/*.rs'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches:
      - main
    paths:
      - '.github/**'
      - 'justfile'
      - '**/*.rs'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv_check:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Single source of truth: rust-version in Cargo.toml
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(grep 'rust-version =' Cargo.toml | cut -d '=' -f2 | cut -d '"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Setup just runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Verify MSRV
        run: just msrv
